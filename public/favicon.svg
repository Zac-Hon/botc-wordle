<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Clocktower">
  <title>Clocktowerdle</title>

  <!-- Dark ground so the gold tower reads on a light browser tab as well as a
       dark one. A transparent icon disappears against half the themes. -->
  <rect width="64" height="64" rx="13" fill="#10131c" />

  <!-- Proportions are a compromise between two failure modes. Drawn to scale a
       clocktower is mostly empty space and collapses into a sliver at 16px;
       widened until it fills the square it stops reading as a tower and starts
       looking like a bank. So: a broad spire and plinth for mass, with a body
       that stays narrower than both to keep the vertical line. The clock is the
       only interior detail, because anything finer turns to mud on a tab. -->
  <g fill="#c8a951">
    <circle cx="32" cy="5" r="2.5" />
    <path d="M32 8 L49 23 H15 Z" />
    <path d="M16 24.5 h32 v6 H16 Z" />
    <path d="M20 32 h24 v21 H20 Z" />
    <path d="M13 54 h38 v7 H13 Z" />
  </g>

  <circle cx="32" cy="42" r="9" fill="#10131c" />
  <circle cx="32" cy="42" r="9" fill="none" stroke="#c8a951" stroke-width="2" />
  <g stroke="#c8a951" stroke-width="2.2" stroke-linecap="round">
    <line x1="32" y1="42" x2="32" y2="36.6" />
    <line x1="32" y1="42" x2="36.2" y2="44.6" />
  </g>
</svg>
